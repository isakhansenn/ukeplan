<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ukeplan</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f5f6f8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ukeplan">
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#253044;background:#f5f6f8}*{box-sizing:border-box}body{margin:0;padding:32px 20px}.wrap{max-width:1400px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}h1{font-size:27px;letter-spacing:-.8px;margin:0 0 6px}.sub{color:#7c8595;font-size:14px}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{font:inherit;cursor:pointer}.nav button,.action{border:1px solid #e0e4e9;background:white;border-radius:10px;padding:10px 13px;color:#344054}.nav button:hover,.action:hover{background:#f1f4f8}.week-label{font-weight:650;min-width:105px;text-align:center}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.day{background:white;border:1px solid #e9ebef;border-radius:16px;min-height:440px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 3px 15px #24334d08}.day.today{border-color:#a5b8dd;box-shadow:0 0 0 2px #e3ebfa}.day-head{padding:20px 17px 15px;border-bottom:1px solid #f0f1f3}.day-title{font-size:15px;font-weight:750}.date{color:#9299a5;font-size:13px;margin-top:5px}.count{font-size:12px;color:#9299a5;margin-top:11px}.tasks{list-style:none;margin:0;padding:12px 10px;flex:1}.task{display:flex;align-items:flex-start;gap:9px;padding:11px 7px;border-radius:9px;border-bottom:1px solid #f4f5f6}.task:hover{background:#fafbfc}.task input{margin:3px 0 0;accent-color:#7189b6;cursor:pointer;flex-shrink:0}.task .text{flex:1;font-size:14px;line-height:1.45;overflow-wrap:anywhere;cursor:text;min-width:0}.task.done .text{color:#b1b7c1;text-decoration:line-through}.task.done{opacity:.65}.task .del{border:0;background:none;color:#b4bbc5;font-size:18px;line-height:1;visibility:hidden;padding:0 2px}.task:hover .del,.task .del:focus{visibility:visible}.add{margin:0 10px 12px;border:1px dashed #dce1e8;background:#fafbfd;border-radius:10px;padding:11px;display:flex;gap:7px}.add textarea{width:100%;min-width:0;background:transparent;border:0;outline:none;font:inherit;font-size:13px;line-height:1.5;resize:vertical;min-height:54px;tab-size:4}.add button{align-self:flex-end}.add button{border:0;border-radius:7px;background:#344b72;color:white;padding:5px 10px;font-size:18px}.hint{margin-top:20px;color:#9299a5;font-size:12px;line-height:1.6}.edit{width:100%;font:inherit;font-size:14px;line-height:1.45;border:1px solid #c9d5e7;border-radius:5px;padding:3px;resize:vertical;min-height:55px}@media(max-width:1100px){.grid{grid-template-columns:repeat(5,minmax(210px,1fr));overflow-x:auto;padding-bottom:12px}.day{min-height:440px}}@media(max-width:560px){body{padding:20px 12px}.grid{grid-template-columns:repeat(5,230px)}.nav{width:100%}.week-label{flex:1}}

/* Tom dag: synlig, klikkbar skrive-linje rett under overskriften */
.day .add.empty-first{flex-shrink:0;min-height:48px;border-bottom:1px solid #b7c2d2;display:block;position:relative;z-index:1}
.day .add.empty-first textarea{min-height:42px;height:42px}
/* Tom dag: diskret skrivefelt */
.add.empty-first{margin:12px 17px 0;padding:0;border:0;border-bottom:1px solid #cdd4df;border-radius:0;background:transparent;display:block;min-height:38px;cursor:text}.add.empty-first:focus-within{border-bottom-color:#9baecc}.add.empty-first textarea{display:block;width:100%;min-height:40px;height:40px;padding:5px 0 7px;font-size:14px;line-height:22px;resize:none;overflow:hidden;cursor:text}.add.empty-first button{display:none}
/* Redigering som i et dokument */
.task .text{white-space:pre-wrap;outline:none;min-height:22px;cursor:text}
.task .text:focus{background:#f7f9fc;border-radius:5px;box-shadow:0 0 0 5px #f7f9fc}
.task .text div,.task .text p{margin:0}
.task .text ul{margin:3px 0;padding-left:19px}
.task.done .text,.task.done .text *{color:#b1b7c1!important;text-decoration:line-through}
.task .del{visibility:visible;opacity:.45}.task:hover .del{opacity:1}
.task .text[contenteditable=true]:empty:before{content:' ';color:#a2aab5}
.day-head{padding-bottom:18px}

/* Valgfritt mørkt tema; oppgaver og sikkerhetskopi påvirkes ikke. */
:root{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark;background:#202020}
html[data-theme="dark"] body{background:#202020;color:#e5e7eb}
html[data-theme="dark"] .sub,html[data-theme="dark"] .date,html[data-theme="dark"] .hint,html[data-theme="dark"] .count{color:#9ca3af}
html[data-theme="dark"] .day{background:#2b2b2b;border-color:#414141;box-shadow:0 3px 15px #0002}
html[data-theme="dark"] .day.today{border-color:#8e8e8e;box-shadow:0 0 0 2px #474747}
html[data-theme="dark"] .day-head{border-bottom-color:#414141}
html[data-theme="dark"] .nav button,html[data-theme="dark"] .action{background:#363636;color:#e5e7eb;border-color:#565656}
html[data-theme="dark"] .nav button:hover,html[data-theme="dark"] .action:hover{background:#484848}
html[data-theme="dark"] .task{border-bottom-color:#414141}
html[data-theme="dark"] .task:hover{background:#343434}
html[data-theme="dark"] .task .text:focus{background:#484848;box-shadow:0 0 0 5px #484848}
html[data-theme="dark"] .task.done .text,html[data-theme="dark"] .task.done .text *{color:#9ca3af!important}
html[data-theme="dark"] .task .del{color:#9ca3af}
html[data-theme="dark"] .add.empty-first{border-bottom-color:#777777}
html[data-theme="dark"] .add textarea{color:#e5e7eb}
html[data-theme="dark"] .add textarea::placeholder{color:#a0a0a0}
html[data-theme="dark"] .edit{background:#363636;color:#e5e7eb;border-color:#777777}
html[data-theme="dark"] #backup-status{color:#b9b9b9!important}
.drag-handle{flex-shrink:0;color:#a0a0a0;cursor:grab;user-select:none;touch-action:none;font-size:19px;line-height:20px;padding:0 2px}.drag-handle{opacity:0;width:17px;min-width:17px;padding:0;overflow:hidden}.drag-handle:focus-visible{opacity:1;outline:2px solid currentColor;outline-offset:2px}.drag-handle:active{cursor:grabbing}.task.dragging{opacity:.35}.task.drag-over{box-shadow:inset 0 3px #969696}.tasks.drag-over{outline:2px dashed #8d8d8d;outline-offset:-4px;border-radius:9px}html[data-theme="dark"] .drag-handle{color:#b2b2b2}html[data-theme="dark"] .tasks.drag-over{outline-color:#b0b0b0}

/* Kompakt toppmeny: bare ukevalg og piler er synlige. */
.menu-wrap{position:relative;flex-shrink:0}.menu-toggle{min-width:43px;min-height:43px;font-size:22px;line-height:1;padding:8px 11px}.app-menu{position:absolute;z-index:50;right:0;top:calc(100% + 9px);width:min(270px,calc(100vw - 30px));padding:8px;background:#fff;border:1px solid #e0e4e9;border-radius:13px;box-shadow:0 12px 32px #0002}.app-menu[hidden]{display:none}.app-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:12px 11px;color:#344054;font-size:14px}.app-menu button:hover,.app-menu button:focus-visible{background:#f1f4f8}.menu-separator{height:1px;background:#e0e4e9;margin:6px 4px}html[data-theme="dark"] .app-menu{background:#303030;border-color:#565656;box-shadow:0 12px 32px #0008}html[data-theme="dark"] .app-menu button{color:#e5e7eb}html[data-theme="dark"] .app-menu button:hover,html[data-theme="dark"] .app-menu button:focus-visible{background:#484848}html[data-theme="dark"] .menu-separator{background:#565656}
@media(max-width:560px){.nav{width:auto;max-width:100%;margin-left:auto}.week-label{flex:0 0 auto;min-width:92px}.menu-wrap{margin-left:2px}}

/* Kun visuelle plassjusteringer – eksisterende dra-og-slipp og JavaScript er urørt. */
body{padding-left:12px;padding-right:12px}
.wrap{max-width:none;width:100%}
.grid{gap:9px}
.day-head{padding-left:12px;padding-right:12px}
.tasks{padding-left:5px;padding-right:5px}
.task{gap:5px;padding-left:3px;padding-right:3px}
.task .del{padding-left:0;padding-right:0;min-width:15px}
.add.empty-first{margin-left:11px;margin-right:11px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(5,minmax(190px,1fr))}}
@media(max-width:560px){body{padding-left:8px;padding-right:8px}.grid{grid-template-columns:repeat(5,210px)}}

/* Ren topp: sentrert ukevalg, diskret navigasjon, meny til høyre. */
body{padding-top:18px}
header{position:relative;display:flex;justify-content:center;align-items:center;min-height:54px;margin-bottom:10px;flex-wrap:nowrap}
.nav{display:contents}
#prev,#next{border:0;background:transparent;box-shadow:none;color:#91949a;padding:7px 11px;font-size:18px;border-radius:9px}
#prev:hover,#next:hover{background:#eceef0;color:#52565c}
#prev{order:1}#week{order:2}#next{order:3}
.week-label{display:inline-flex;align-items:baseline;justify-content:center;gap:10px;min-width:0;font-size:20px;font-weight:620;letter-spacing:-.3px;color:#737982}
.week-year{font-size:12px;font-weight:400;color:#a4a9b0;letter-spacing:0}
.menu-wrap{position:absolute;right:0;top:50%;transform:translateY(-50%);margin:0;display:flex;align-items:center;gap:2px}
.menu-toggle{border:0!important;background:transparent!important;color:#7d838b!important;font-size:22px}
.sync-toggle{border:0!important;background:transparent!important;color:#7d838b!important;font-size:23px;min-width:40px;min-height:43px;padding:5px 8px;border-radius:9px;cursor:pointer}.sync-toggle:hover{background:#eceef0!important;color:#40454b!important}.sync-toggle:disabled{opacity:.4;cursor:wait}
.menu-toggle:hover{background:#eceef0!important;color:#40454b!important}
.day-title{color:#777e87;font-weight:680}
#backup-status{opacity:.62;font-size:11px!important;margin-bottom:10px!important;min-height:15px}
html[data-theme="dark"] .week-label,html[data-theme="dark"] .day-title{color:#a3a3a3}
html[data-theme="dark"] .week-year{color:#777}
html[data-theme="dark"] #prev,html[data-theme="dark"] #next{color:#909090;background:transparent;border:0}
html[data-theme="dark"] #prev:hover,html[data-theme="dark"] #next:hover{color:#ddd;background:#333}
html[data-theme="dark"] .menu-toggle,html[data-theme="dark"] .sync-toggle{color:#aaa!important;background:transparent!important;border:0!important}
html[data-theme="dark"] .sync-toggle:hover{background:#393939!important;color:#eee!important}
html[data-theme="dark"] .menu-toggle:hover{background:#393939!important;color:#eee!important}
@media(max-width:560px){header{min-height:48px}.week-label{font-size:19px;gap:6px}#prev,#next{padding:6px 8px}.menu-wrap{right:0}.nav{display:contents}}

.carry-setting{display:flex;flex-direction:column;gap:8px;padding:10px 11px;color:#7d838b;font-size:12px}
.carry-setting input{width:100%;padding:7px 9px;border-radius:8px;border:1px solid #c7cbd0;background:transparent;color:inherit;font:inherit;font-size:14px}
html[data-theme="dark"] .carry-setting{color:#b6b6b6}
html[data-theme="dark"] .carry-setting input{border-color:#666;color:#e5e5e5;color-scheme:dark}
.task.carried{opacity:.48}.task.carried .text,.task.carried .text *{color:#90949b!important;text-decoration:none!important}.task .carried-mark{width:14px;flex:0 0 14px;margin-top:1px;font-size:16px;line-height:19px;color:#8c9096;text-align:center}
html[data-theme="dark"] .task.carried .text,html[data-theme="dark"] .task.carried .text *{color:#a3a3a3!important}
/* Egen tekststyrke for i dag, fremtidige og tidligere dager. */
:root{--task-opacity-today:1;--task-opacity-future:.52;--task-opacity-past:.52}
.day.today .task:not(.done):not(.carried) .text{opacity:var(--task-opacity-today)}
.day.future .task:not(.done):not(.carried) .text{opacity:var(--task-opacity-future)}
.day.past .task:not(.done):not(.carried) .text{opacity:var(--task-opacity-past)}
.day .task:not(.done):not(.carried) .text:focus{opacity:1}
/* La dagoverskriften følge samme styrke som oppgaveteksten. */
.day.today .day-title{opacity:var(--task-opacity-today)}
.day.future .day-title{opacity:var(--task-opacity-future)}
.day.past .day-title{opacity:var(--task-opacity-past)}
/* Tidligere oppgaver kan være fullført eller videreført. Disse må også reagere på glidebryteren. */
.day.past .task.done .text,.day.past .task.carried .text{opacity:var(--task-opacity-past)}
.contrast-settings{padding:10px 11px;color:#7d838b;font-size:12px}
.contrast-settings-title{font-weight:600;margin-bottom:10px}
.contrast-setting{display:grid;grid-template-columns:1fr auto;gap:3px 8px;margin:9px 0}
.contrast-setting label{grid-column:1}
.contrast-setting output{grid-column:2;font-variant-numeric:tabular-nums}
.contrast-setting input{grid-column:1/-1;width:100%;accent-color:#777;margin:3px 0 5px}
html[data-theme="dark"] .contrast-settings{color:#b6b6b6}

/* Tettere toppfelt uten endringer i funksjonalitet. */
body{padding-top:8px}
header{min-height:42px;margin-bottom:4px}
#backup-status{margin-bottom:5px!important}
@media(max-width:560px){header{min-height:40px}}

/* Dagsnavn og vanlig oppgavetekst har samme utgangsfarge og samme styrke.
   Historiske dager og markerte oppgaver beholder tidligere regler. */
.day.today .day-title,.day.future .day-title{color:inherit}
html[data-theme="dark"] .day.today .day-title,html[data-theme="dark"] .day.future .day-title{color:inherit}
/* Ytterligere komprimering av toppfeltet. */
body{padding-top:3px}
header{min-height:34px;margin-bottom:0}
#backup-status{margin-bottom:2px!important;min-height:12px;line-height:12px}
#prev,#next{padding-top:3px;padding-bottom:3px}
@media(max-width:560px){body{padding-top:3px}header{min-height:34px}}
</style>
</head>
<body><div class="wrap"><header><div class="nav"><button id="prev" aria-label="Forrige uke">←</button><span class="week-label" id="week"></span><button id="next" aria-label="Neste uke">→</button><div class="menu-wrap"><button class="sync-toggle" id="sync-now" type="button" aria-label="Synkroniser" title="Synkroniser">⟳</button><button class="action menu-toggle" id="menu-toggle" type="button" aria-label="Åpne meny" aria-haspopup="true" aria-expanded="false" aria-controls="app-menu">☰</button><div class="app-menu" id="app-menu" hidden><button id="current" type="button">Denne uken</button><button id="theme-toggle" type="button" aria-label="Bytt mellom lyst og mørkt tema" aria-pressed="false">Mørkt tema</button><div class="menu-separator"></div><div class="contrast-settings" role="group" aria-label="Juster oppgavetekst"><div class="contrast-settings-title">Oppgavetekst – synlighet</div><div class="contrast-setting"><label for="contrast-today">I dag</label><output id="contrast-today-value" for="contrast-today">100 %</output><input id="contrast-today" type="range" min="20" max="100" step="5" value="100"></div><div class="contrast-setting"><label for="contrast-future">Fremtidige dager</label><output id="contrast-future-value" for="contrast-future">50 %</output><input id="contrast-future" type="range" min="20" max="100" step="5" value="50"></div><div class="contrast-setting"><label for="contrast-past">Tidligere dager</label><output id="contrast-past-value" for="contrast-past">50 %</output><input id="contrast-past" type="range" min="20" max="100" step="5" value="50"></div></div><div class="menu-separator"></div><label class="carry-setting" for="carry-time">Overføring av uferdige oppgaver <input id="carry-time" type="time" value="00:00"></label><button id="test-carry" type="button">Test overføring nå</button><div class="menu-separator"></div><button id="connect-backup" type="button">Velg sikkerhetskopifil</button><button id="export" type="button">Eksporter</button><button id="import" type="button">Importer</button></div></div><input type="file" id="import-file" accept=".json,application/json" hidden></div></header><div id="backup-status" role="status" aria-live="polite" style="font-size:11px;color:#777777;margin:0 0 12px">Lagret OK</div><main class="grid" id="grid"></main></div>
<script>
(()=>{'use strict';

const menuToggle=document.getElementById('menu-toggle');
const appMenu=document.getElementById('app-menu');
function closeMenu(){appMenu.hidden=true;menuToggle.setAttribute('aria-expanded','false');menuToggle.setAttribute('aria-label','Åpne meny')}
menuToggle.addEventListener('click',()=>{const open=appMenu.hidden;appMenu.hidden=!open;menuToggle.setAttribute('aria-expanded',String(open));menuToggle.setAttribute('aria-label',open?'Lukk meny':'Åpne meny')});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.menu-wrap'))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();menuToggle.focus()}});
appMenu.addEventListener('click',e=>{if(e.target.closest('button'))closeMenu()});
const CONTRAST_KEY='ukeplan-task-text-contrast';
const contrastDefaults={today:100,future:50,past:50};
let contrastPrefs={...contrastDefaults};
try{const stored=JSON.parse(localStorage.getItem(CONTRAST_KEY));if(stored&&typeof stored==='object'){for(const key of Object.keys(contrastDefaults)){const v=Number(stored[key]);if(Number.isFinite(v)&&v>=20&&v<=100)contrastPrefs[key]=Math.round(v/5)*5}}}catch{}
for(const key of Object.keys(contrastDefaults)){
 const slider=document.getElementById('contrast-'+key),output=document.getElementById('contrast-'+key+'-value');
 const update=()=>{const value=contrastPrefs[key];slider.value=value;output.textContent=value+' %';document.documentElement.style.setProperty('--task-opacity-'+key,String(value/100))};
 update();
 slider.addEventListener('input',()=>{contrastPrefs[key]=Number(slider.value);update();try{localStorage.setItem(CONTRAST_KEY,JSON.stringify(contrastPrefs))}catch{}});
}
const themeKey='ukeplan-theme';
const themeButton=document.getElementById('theme-toggle');
function setTheme(theme){const dark=theme==='dark';document.documentElement.dataset.theme=dark?'dark':'light';themeButton.textContent=dark?'Lyst tema':'Mørkt tema';themeButton.setAttribute('aria-pressed',String(dark));document.querySelector('meta[name="theme-color"]').content=dark?'#202020':'#f5f6f8';}
try{setTheme(localStorage.getItem(themeKey)==='dark'?'dark':'light')}catch{setTheme('light')}
themeButton.addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(next);try{localStorage.setItem(themeKey,next)}catch{}});
const KEY='ukeplanlegger_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{tasks:[],lastProcessed:null}}catch{state={tasks:[],lastProcessed:null}};
if(!Array.isArray(state.tasks))state.tasks=[];
const CARRY_TIME_KEY='ukeplan-carry-time';
let carryTime='00:00';try{const stored=localStorage.getItem(CARRY_TIME_KEY);if(/^([01]\d|2[0-3]):[0-5]\d$/.test(stored||''))carryTime=stored}catch{}
const carryInput=document.getElementById('carry-time');carryInput.value=carryTime;
carryInput.addEventListener('change',()=>{if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(carryInput.value))return;carryTime=carryInput.value;localStorage.setItem(CARRY_TIME_KEY,carryTime);render()});

const names=['Mandag','Tirsdag','Onsdag','Torsdag','Fredag'];const pad=n=>String(n).padStart(2,'0');
function dateKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parse(k){let [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function monday(d){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);return addDays(x,-((x.getDay()+6)%7))}
function nextWork(k){let d=addDays(parse(k),1);while(d.getDay()===0||d.getDay()===6)d=addDays(d,1);return dateKey(d)}
function todayWork(){let d=new Date();let x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);while(x.getDay()===0||x.getDay()===6)x=addDays(x,1);return dateKey(x)}
let backupHandle=null,backupQueue=Promise.resolve(),backupRevision=0;
const backupStatus=document.getElementById('backup-status');
// Oppgaver lagres umiddelbart. Kun statusvisningen oppdateres hvert 10. minutt.
let lastStatusPaint=Date.now(),pendingStatus=null,latestStorageOK=true;
function paintStatus(message,warning){
  backupStatus.textContent=warning?'Lagring ikke OK':'Lagret OK';
  backupStatus.title=message;
  backupStatus.style.color=warning?'#b45309':'';
  lastStatusPaint=Date.now();
}
function status(message,warning=false){
  const localFailure=/FEIL: Kunne ikke lagre oppgavene lokalt/i.test(message);
  if(localFailure)latestStorageOK=false;
  else if(/Lagret lokalt|Lokal lagring/i.test(message))latestStorageOK=true;
  const isWarning=warning || /FEIL|feilet|Kunne ikke/i.test(message);
  if(isWarning){pendingStatus=null;paintStatus(message,true);return}
  pendingStatus={message,warning:false};
  if(Date.now()-lastStatusPaint>=10*60*1000){paintStatus(message,false);pendingStatus=null}
}
setInterval(()=>{if(pendingStatus){paintStatus(pendingStatus.message,pendingStatus.warning);pendingStatus=null}},10*60*1000);
function backupPayload(){return JSON.stringify({format:'ukeplanlegger-backup',version:1,exportedAt:new Date().toISOString(),data:state},null,2)}
function dbOpen(){return new Promise((resolve,reject)=>{const req=indexedDB.open('ukeplanlegger-backup-handle',1);req.onupgradeneeded=()=>req.result.createObjectStore('settings');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function storeHandle(handle){const db=await dbOpen();try{await new Promise((resolve,reject)=>{const tx=db.transaction('settings','readwrite');tx.objectStore('settings').put(handle,'file');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}finally{db.close()}}
async function restoreHandle(){const db=await dbOpen();try{return await new Promise((resolve,reject)=>{const tx=db.transaction('settings','readonly');const req=tx.objectStore('settings').get('file');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}finally{db.close()}}
async function writeBackup(snapshot){if(!backupHandle)return;const permission=await backupHandle.queryPermission({mode:'readwrite'});if(permission!=='granted'){status('Lagret lokalt · Sikkerhetskopi trenger tilgang: trykk «Aktiver sikkerhetskopi»',true);document.getElementById('connect-backup').textContent='Aktiver sikkerhetskopi';return}const writable=await backupHandle.createWritable();await writable.write(snapshot);await writable.close();status('✓ Lagret lokalt · ✓ Sikkerhetskopiert til OneDrive-fil');document.getElementById('connect-backup').textContent='Bytt sikkerhetskopifil'}
function scheduleBackup(){if(!backupHandle)return;const snapshot=backupPayload();const revision=++backupRevision;backupQueue=backupQueue.catch(()=>{}).then(async()=>{if(revision!==backupRevision)return;try{await writeBackup(snapshot)}catch(e){status('Lagret lokalt · Sikkerhetskopiering feilet: '+e.message,true)}})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));status(backupHandle?'✓ Lagret lokalt · Sikkerhetskopierer …':'✓ Lagret lokalt · Ingen automatisk sikkerhetskopi valgt');scheduleBackup()}catch{status('FEIL: Kunne ikke lagre oppgavene lokalt!',true);alert('Kunne ikke lagre oppgavene i nettleseren.')}}
const connectButton=document.getElementById('connect-backup');
connectButton.addEventListener('click',async()=>{if(!('showSaveFilePicker' in window)){alert('Automatisk fillagring krever Chrome eller Edge på PC via HTTPS. Bruk Eksporter som reserve.');return}try{
if(backupHandle&&connectButton.textContent==='Aktiver sikkerhetskopi'){const permission=await backupHandle.requestPermission({mode:'readwrite'});if(permission==='granted'){scheduleBackup();return}}
const handle=await window.showSaveFilePicker({suggestedName:'ukeplanlegger_data.json',types:[{description:'JSON-sikkerhetskopi',accept:{'application/json':['.json']}}]});
// Never silently overwrite an existing backup file.
const existing=await handle.getFile();if(existing.size>0){if(!confirm('Denne filen inneholder allerede data. Hvis du fortsetter, overskrives den med oppgavene i appen. Har du kontrollert at det er riktig fil?'))return}
backupHandle=handle;await storeHandle(handle);scheduleBackup();connectButton.textContent='Bytt sikkerhetskopifil'
}catch(e){if(e.name!=='AbortError')status('Kunne ikke koble til sikkerhetskopifilen: '+e.message,true)}});
(async()=>{try{backupHandle=await restoreHandle();if(!backupHandle)return;const permission=await backupHandle.queryPermission({mode:'readwrite'});if(permission==='granted'){connectButton.textContent='Bytt sikkerhetskopifil';status('✓ Lokal lagring · Sikkerhetskopifil tilkoblet')}else{connectButton.textContent='Aktiver sikkerhetskopi';status('Lagret lokalt · Trykk «Aktiver sikkerhetskopi» for å gi filtilgang',true)}}catch(e){status('Lagret lokalt · Automatisk sikkerhetskopi er ikke tilgjengelig',true)}})();
// PC: oppdater eksisterende sikkerhetskopifil. iPhone: velg fil fra OneDrive og importer.
const syncNow=document.getElementById('sync-now');
syncNow.addEventListener('click',async()=>{
  if(syncNow.disabled)return;
  syncNow.disabled=true;
  try{
    if(!('showSaveFilePicker' in window)){
      document.getElementById('import-file').click();
      return;
    }
    if(!backupHandle){
      alert('Velg først en sikkerhetskopifil via ☰ → Velg sikkerhetskopifil.');
      return;
    }
    let permission=await backupHandle.queryPermission({mode:'readwrite'});
    if(permission!=='granted')permission=await backupHandle.requestPermission({mode:'readwrite'});
    if(permission!=='granted'){
      status('Sikkerhetskopien er ikke oppdatert: filtilgang mangler.',true);
      return;
    }
    // Skriv nøyaktig nåværende tilstand, og vent til skrivingen er ferdig.
    const snapshot=backupPayload();
    ++backupRevision;
    backupQueue=backupQueue.catch(()=>{}).then(()=>writeBackup(snapshot));
    await backupQueue;
    paintStatus('Sikkerhetskopien er oppdatert nå.',false);
  }catch(e){
    status('Synkronisering feilet: '+e.message,true);
  }finally{syncNow.disabled=false}
});

// Previous-day snapshots are immutable; the active task is moved, not duplicated.
function snapshot(t,day){
 t.history=Array.isArray(t.history)?t.history:[];
 if(!t.history.some(h=>(typeof h==='string'?h:h.day)===day))
   t.history.push({day,html:t.html||'',text:t.text||''});
}
function carry(){
 const now=new Date(),today=dateKey(now),clock=pad(now.getHours())+':'+pad(now.getMinutes());
 const cutoffPassed=clock>=carryTime;
 let changed=false;
 for(const t of state.tasks){
   if(t.done||t.pinnedPast||!t.day||t.day>=today)continue;
   // A task is due to move only when the next workday's cutoff has passed.
   let guard=0;
   while(t.day<today&&guard++<4000){
     const target=nextWork(t.day);
     if(target>today||target===today&&!cutoffPassed)break;
     snapshot(t,t.day);t.day=target;changed=true;
   }
 }
 if(changed)save();
}
function testCarry(){
 const today=dateKey(new Date()),tasks=state.tasks.filter(t=>!t.done&&!t.pinnedPast&&t.day===today);
 if(!tasks.length){alert('Ingen uferdige oppgaver på dagens dato å teste med.');return}
 const target=nextWork(today);
 if(!confirm(`Test: Flytte ${tasks.length} uferdige oppgave(r) fra i dag til neste arbeidsdag (${target})? De blir stående grået ut med ☒ på dagens dato.`))return;
 for(const t of tasks){snapshot(t,t.day);t.day=target}
 save();render();alert('Testen er gjennomført. Gå til neste arbeidsdag for å se de aktive oppgavene.');
}
document.getElementById('test-carry').addEventListener('click',testCarry);
let shown=monday(new Date());const grid=document.getElementById('grid');
function weekNo(d){let a=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));a.setUTCDate(a.getUTCDate()+4-(a.getUTCDay()||7));let y=a.getUTCFullYear();return {n:Math.ceil((((a-new Date(Date.UTC(y,0,1)))/86400000)+1)/7),y}}
function cleanHTML(html){let box=document.createElement('div');box.innerHTML=html;box.querySelectorAll('script,style,iframe,object,embed,svg,form,input,button').forEach(el=>el.remove());for(const el of [...box.querySelectorAll('*')]){for(const attr of [...el.attributes])if(attr.name!=='style'&&attr.name!=='class')el.removeAttribute(attr.name);if(el.hasAttribute('style')){const margin=el.style.marginLeft;el.removeAttribute('style');if(margin&&/^\d+(px|em)$/.test(margin))el.style.marginLeft=margin}}return box.innerHTML}
function plain(html){let e=document.createElement('div');e.innerHTML=html;return e.textContent.trim()}
function insertText(text){document.execCommand('insertText',false,text)}
let draggedTaskId=null;
function moveTask(taskId,targetDay,beforeId=null){
 const index=state.tasks.findIndex(t=>t.id===taskId);if(index<0||taskId===beforeId)return;
 const task=state.tasks[index];state.tasks.splice(index,1);
 task.day=targetDay;task.pinnedPast=targetDay<dateKey(new Date());
 // Flytting er en ny planlegging, ikke en automatisk videreføring.
 task.history=[];
 if(task.done)task.completedAt=targetDay;
 const insertAt=beforeId?state.tasks.findIndex(t=>t.id===beforeId):-1;
 if(insertAt<0)state.tasks.push(task);else state.tasks.splice(insertAt,0,task);
 save();render();
}
function taskRow(t,historical,displayDay,historicalSnapshot=null){
 let li=document.createElement('li');li.className='task'+(historical?' carried':t.done?' done':'');
 let box=historical?document.createElement('span'):document.createElement('input');if(historical){box.className='carried-mark';box.textContent='☒';box.setAttribute('aria-label','Videreført')}else{box.type='checkbox';box.checked=!!t.done;box.setAttribute('aria-label','Marker hele oppgaven som utført');}
 if(!historical)box.addEventListener('change',()=>{t.done=box.checked;t.completedAt=t.done?t.day:null;save();render()});
 let span=document.createElement('div');span.className='text';span.innerHTML=cleanHTML(historical?(historicalSnapshot?.html||t.html||''):(t.html||''));
 if(!span.innerHTML&&(historical?(historicalSnapshot?.text||t.text):t.text))span.textContent=historical?(historicalSnapshot?.text||t.text):t.text;
 if(!historical){span.contentEditable='true';span.setAttribute('role','textbox');span.setAttribute('aria-multiline','true');span.setAttribute('aria-label','Rediger oppgave og delpunkter');
 span.addEventListener('input',()=>{t.html=cleanHTML(span.innerHTML);t.text=span.textContent;save()});
 span.addEventListener('blur',()=>{t.html=cleanHTML(span.innerHTML);t.text=span.textContent;save()});
 span.addEventListener('paste',e=>{e.preventDefault();insertText(e.clipboardData.getData('text/plain'))});
 span.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();t.html=cleanHTML(span.innerHTML);t.text=span.textContent;const newTask={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),text:'',html:'',day:displayDay,done:false,history:[],pinnedPast:displayDay<dateKey(new Date())};const at=state.tasks.findIndex(x=>x.id===t.id);state.tasks.splice(at+1,0,newTask);save();render();const target=grid.querySelector(`[data-task-id="${newTask.id}"] .text`);if(target){target.focus();const selection=window.getSelection();const range=document.createRange();range.selectNodeContents(target);range.collapse(false);selection.removeAllRanges();selection.addRange(range)}return}if(e.key==='Tab'){e.preventDefault();if(e.shiftKey){const sel=window.getSelection();let node=sel.anchorNode;let parent=node?.nodeType===1?node:node?.parentElement;const block=parent?.closest('div,p,li');if(block&&span.contains(block)){const n=parseInt(block.style.marginLeft||'0',10);block.style.marginLeft=Math.max(0,n-20)+'px';t.html=cleanHTML(span.innerHTML);save()}}else{insertText('    ')} } });
 }
 li.dataset.taskId=t.id;
 if(!historical){
   const handle=document.createElement('span');handle.className='drag-handle';handle.textContent='⠿';handle.title='Dra fra feltet til venstre for avkrysningsboksen for å flytte oppgaven';handle.setAttribute('aria-label','Dra oppgaven');handle.draggable=true;
   handle.addEventListener('dragstart',e=>{draggedTaskId=t.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',t.id);li.classList.add('dragging')});
   handle.addEventListener('dragend',()=>{draggedTaskId=null;document.querySelectorAll('.drag-over,.dragging').forEach(el=>el.classList.remove('drag-over','dragging'))});
   li.append(handle);
   li.addEventListener('dragover',e=>{if(!draggedTaskId||draggedTaskId===t.id)return;e.preventDefault();e.stopPropagation();e.dataTransfer.dropEffect='move';li.classList.add('drag-over')});
   li.addEventListener('dragleave',()=>li.classList.remove('drag-over'));
   li.addEventListener('drop',e=>{if(!draggedTaskId)return;e.preventDefault();e.stopPropagation();moveTask(draggedTaskId,displayDay,t.id);draggedTaskId=null});
 }
 li.append(box,span);
 if(!historical){let del=document.createElement('button');del.className='del';del.textContent='×';del.title='Slett oppgave';del.setAttribute('aria-label','Slett oppgave');del.addEventListener('click',()=>{if(confirm('Slette oppgaven?')){state.tasks=state.tasks.filter(x=>x.id!==t.id);save();render()}});li.append(del)}
 return li
}
function render(){carry();const w=weekNo(shown);document.getElementById('week').innerHTML=`Uke ${w.n}<span class="week-year">${w.y}</span>`;grid.replaceChildren();let today=dateKey(new Date());for(let i=0;i<5;i++){let d=addDays(shown,i),key=dateKey(d);let card=document.createElement('section');card.className='day '+(key===today?'today':key<today?'past':'future');let head=document.createElement('div');head.className='day-head';let title=document.createElement('div');title.className='day-title';title.textContent=names[i];let date=document.createElement('div');date.className='date';date.textContent=d.toLocaleDateString('nb-NO',{day:'numeric',month:'long'});let actual=state.tasks.filter(t=>t.day===key);let historical=state.tasks.filter(t=>t.day!==key&&Array.isArray(t.history)&&t.history.some(h=>(typeof h==='string'?h:h.day)===key));let active=actual.filter(t=>!t.done);let done=actual.filter(t=>t.done);head.append(title,date);let list=document.createElement('ul');list.className='tasks';
 list.addEventListener('dragover',e=>{if(!draggedTaskId)return;e.preventDefault();e.dataTransfer.dropEffect='move';list.classList.add('drag-over')});
 list.addEventListener('dragleave',e=>{if(!list.contains(e.relatedTarget))list.classList.remove('drag-over')});
 list.addEventListener('drop',e=>{if(!draggedTaskId)return;e.preventDefault();moveTask(draggedTaskId,key);draggedTaskId=null});for(const t of [...active,...done])list.append(taskRow(t,false,key));for(const t of historical){let snap=t.history.find(h=>(typeof h==='string'?h:h.day)===key);let row=taskRow(t,true,key,typeof snap==='string'?null:snap);row.title='Historikk: oppgaven ble videreført til en senere dag';list.append(row)}let form=document.createElement('form');form.className='add empty-first';let input=document.createElement('textarea');input.placeholder='';input.setAttribute('aria-label',`Ny oppgave med delpunkter ${names[i]}`);let btn=document.createElement('button');btn.type='submit';btn.textContent='+';btn.setAttribute('aria-label','Legg til hele oppgaven');form.append(input,btn);form.addEventListener('click',e=>{if(e.target===form)input.focus()});input.addEventListener('input',()=>{input.style.height='34px';input.style.height=Math.max(34,input.scrollHeight)+'px'});
 input.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const a=input.selectionStart,b=input.selectionEnd;const v=input.value;if(e.shiftKey){let start=v.lastIndexOf('\n',a-1)+1;let remove=v.slice(start).match(/^( {1,4}|\t)/)?.[0]||'';if(remove){input.value=v.slice(0,start)+v.slice(start+remove.length);input.selectionStart=Math.max(start,a-remove.length);input.selectionEnd=Math.max(start,b-remove.length)}}else{input.setRangeText('    ',a,b,'end')}}else if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}else if(e.key==='Enter'&&e.shiftKey){e.preventDefault();input.setRangeText('\n',input.selectionStart,input.selectionEnd,'end')}});
 input.addEventListener('blur',()=>{if(input.value.trim())form.requestSubmit()});form.addEventListener('submit',e=>{e.preventDefault();let value=input.value.trim();if(!value)return;const lines=value.replace(/\r/g,'').split('\n');const html=lines.map(line=>{const indentation=(line.match(/^[ \t]*/)||[''])[0].replace(/\t/g,'    ').length;const content=line.trim();const el=document.createElement('div');el.style.marginLeft=(Math.min(12,Math.floor(indentation/4))*20)+'px';el.textContent=content||' ';return el.outerHTML}).join('');const newId=crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());state.tasks.push({id:newId,text:value,html,day:key,done:false,history:[],pinnedPast:key<dateKey(new Date())});save();render();const rows=[...(grid.children[i]?.querySelectorAll('.task:not(.done) .text')||[])];const created=rows.find(el=>el.closest('.task')?.dataset.taskId===newId);if(created)created.focus()});card.append(head);card.append(list);if(actual.length===0)card.insertBefore(form,list);grid.append(card)}}
document.getElementById('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({format:'ukeplanlegger-backup',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ukeplanlegger-sikkerhetskopi-'+dateKey(new Date())+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)});
document.getElementById('import').addEventListener('click',()=>document.getElementById('import-file').click());
document.getElementById('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('Filen er for stor.');const parsed=JSON.parse(await file.text());if(parsed.format!=='ukeplanlegger-backup'||!parsed.data||!Array.isArray(parsed.data.tasks))throw Error('Ugyldig sikkerhetskopi.');if(!parsed.data.tasks.every(t=>t&&typeof t.id==='string'&&typeof t.day==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(t.day)))throw Error('Oppgavene har ugyldig format.');if(!confirm('Import erstatter oppgavene som er lagret her. Fortsette?'))return;state={tasks:parsed.data.tasks,lastProcessed:parsed.data.lastProcessed||null};save();render();alert('Sikkerhetskopien er importert.')}catch(err){alert('Kunne ikke importere: '+err.message)}finally{e.target.value=''}});
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
document.getElementById('prev').onclick=()=>{shown=addDays(shown,-7);render()};document.getElementById('next').onclick=()=>{shown=addDays(shown,7);render()};document.getElementById('current').onclick=()=>{shown=monday(new Date());render()};render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});setInterval(()=>{if(!document.hidden)render()},60000);
})();
</script></body></html>
